# Pro forma inputs, read by tools/proforma.py (report: db/proforma.md; viewer: Pro forma tab).
#
# Sales, food cost and prep hours come from the menu database itself. Each format
# (under labor.formats) has a design day: the bakery-café uses every product's
# par_daily; the roll bakery lists its own short menu and volumes. Each site's
# sales_index scales its format's design day to the site. Everything else is set here.
#
# Dollar figures are 2026 estimates unless a source is given. Sites, sizes and rents
# come from the reports in reports/ (site scan, 2026-11-07; shortlist, 2026-11-08);
# none has been confirmed with a broker.

as_of: 2026-11-19

operating:
  days_per_year: 360            # default: open daily, closed five holidays; a format can set its own
  hours: "6:30 am to 3:00 pm, seven days"
  # Year-1 sales as % of the site's steady state, month by month.
  ramp_year1_pct: [55, 60, 65, 70, 75, 80, 85, 88, 91, 94, 97, 100]
  price_growth_pct: 3           # Year 3 sales over Year 2, from menu price increases
  cost_inflation_pct: 3         # yearly rise in wages, rent and fixed costs
  # Points added to the menu's food-and-packaging cost for comps, staff meals,
  # spoilage beyond the waste allowances and price drift before real invoices.
  # Raised from 3 on 2026-11-10: it brings the café to 25% of sales, the low end of
  # the research's 25–35% benchmark. The recipes allow only 0–5% for waste and every
  # ingredient price is still an estimate.
  cogs_buffer_pts: 5.5

variable_costs_pct_of_sales:
  card_processing: 2.6          # about 90% of sales on cards at about 2.9%
  repairs_maintenance: 1.5
  supplies_cleaning: 1.5        # cleaning, smallwares replacement, non-food supplies
  marketing: 2.0
  delivery_net: 0.5             # app commissions after the 20% app price markup
  miscellaneous: 1.0

fixed_costs_per_year:           # Year-1 dollars
  insurance: 8500               # general liability, property, umbrella; workers' comp is in the payroll burden
  software_pos: 5000            # point of sale, online ordering, scheduling
  accounting_payroll_legal: 9000
  licenses_music: 2500          # Common Victualler and health permit renewals, music licensing
  waste_pest: 7200
  linens_uniforms: 2400
  internet_phone: 2400

# Gas, electric and water for ovens, refrigeration and the bar. Raised from $10 on
# 2026-11-10: $10 came to 1.5–2% of sales, and restaurants commonly run 3% or more
# (a rule of thumb, not from the market research).
utilities_per_sqft_year: 20

labor:
  burden_pct: 12                # FICA, FUTA, MA UI, training fund, workers' comp (research: statutory 8.5–9% plus workers' comp 1–3%)
  fixed_share: 0.6              # share of scheduled hours that doesn't flex with sales
  manager:
    title: General manager
    salary: 60000               # if the owner runs the shop instead, add this back: see owner's earnings
  # Scheduled hourly crew per day at each format's design volume. Wages from the
  # research's Boston medians: bakers $18.54, food prep $19.07, counter $17.45,
  # MA minimum $15.00; counter and bar staff also share tips.
  formats:
    cafe:
      label: "Bakery-café: full menu with lunch, about 24 seats"
      design_index: 1.0         # staffed for the menu's full par day
      items_per_order: 2.0      # assumption, used only to turn sales into an order count
      hero: cinnamon_roll
      manager: true             # a hired general manager runs it
      roles:
        - {role: Lead baker, hours: 8.5, wage: 25.00, note: "4:30 am start: mixes, shapes and bakes"}
        - {role: Baker and prep, hours: 8, wage: 20.00, note: "pastry, glazes, cookie and brownie batches, salad prep"}
        - {role: Line cook, hours: 8, wage: 19.50, note: "breakfast and lunch sandwiches, soup, catering boxes"}
        - {role: Baristas, hours: 14, wage: 16.50, note: "two at the morning peak, one after; plus tips"}
        - {role: Counter, hours: 10, wage: 15.50, note: "register, pastry case, grab-and-go; plus tips"}
        - {role: Dish and porter, hours: 5, wage: 15.50, note: "late morning to close"}
    # The smaller first shop: one hero pastry, a short case and coffee. The owner runs
    # it but doesn't bake: a hired lead baker does (changed 2026-11-10). The research's
    # independent winners start this way and add lunch at a second, bigger shop.
    roll_bakery:
      label: "Roll bakery: the cinnamon roll, six other pastries and coffee; about 8 seats"
      hours: "7:00 am to 2:00 pm, Tuesday to Sunday"
      days_per_year: 307        # six days a week, closed five holidays
      design_index: 1.0         # staffed for this format's design day
      items_per_order: 1.8      # assumption, used only to turn sales into an order count
      hero: cinnamon_roll
      manager: false            # the owner runs it; the P&L pays the owner nothing
      owner_pay_target: 60000   # what a hired manager would cost instead (labor.manager.salary)
      financing: {loan_share_pct: 0}   # paid in cash: the owner doesn't expect a loan for a build-out this size
      roles:
        - {role: "Owner, manager", hours: 6, owner: true, note: "runs the shop: ordering, schedule, books and the pre-order line; not on the bench"}
        - {role: Lead baker, hours: 9, wage: 25.00, note: "4:30 am start: mixes, rolls, bakes and glazes"}
        - {role: Baker and prep, hours: 6, wage: 20.00, note: "shaping at the morning peak, then scones, muffins, cookies and tomorrow's dough"}
        - {role: Barista, hours: 8.5, wage: 16.50, note: "opens the bar; plus tips"}
        - {role: Counter, hours: 8, wage: 15.50, note: "register, pastry case and boxes; plus tips"}
        - {role: Peak help, hours: 3, wage: 15.50, note: "an average: none on quiet weekdays, more on weekends"}
        - {role: Dish and close, hours: 2, wage: 15.50, note: ""}
      # This format's design day: units sold a day. Products left out aren't sold.
      # No griddle, soup or salads, so no grease hood and no line cook.
      menu:
        cinnamon_roll: 110
        blueberry_scone: 15
        mini_vanilla_scone: 20
        blueberry_muffin: 18
        coffee_cake_slice: 10
        cookie_chocolate_chip: 20
        brownie: 12
        drip_coffee: 55
        latte: 30
        iced_coffee: 15
        iced_latte: 12
        matcha_latte: 6
        chai_latte: 6
        espresso: 6
        lemonade_kids: 7
        oat_milk_swap: 15
        almond_milk_swap: 4
        cinnamon_roll_4pack: 6
        pastry_box_dozen: 1.5
        cookie_brownie_box: 0.5
        coffee_cake_whole: 0.3
        coffee_traveler: 0.5
      # A smaller shop with fewer staff: these replace the same lines below and in startup.
      fixed_costs_per_year: {insurance: 6000, software_pos: 3600, accounting_payroll_legal: 7000, licenses_music: 2000, waste_pest: 4800, linens_uniforms: 1500}
      startup: {signage: 8000, opening_inventory: 5000, launch_marketing: 8000, furniture_base: 4000}
    # The Miami business, designed from first principles (2026-11-19). Plan:
    # reports/Miami bakery business plan.md. Two stages share one product line and
    # one price list. Wages in both are Miami's (Florida's minimum is $15.00).
    #
    # Stage 1, the pop-up: prove the demand before any lease. Production in a rented
    # shared kitchen; sales at two farmers markets, a Saturday pre-order pickup,
    # office orders and school fundraisers. The owner works the stall.
    roll_popup:
      label: "Pop-up: markets, pre-order drops, office orders and fundraisers from a rented commissary kitchen"
      hours: "Markets on Saturday and Sunday; pre-order pickup on Saturday; office orders Wednesday to Friday"
      days_per_year: 190        # four working days a week for 48 weeks, less two
      design_index: 1.0
      items_per_order: 1.5
      hero: cinnamon_roll
      manager: false
      owner_pay_target: 60000
      financing: {loan_share_pct: 0}
      production_scale: true    # prep minutes at the database's production-kitchen batch sizes
      fixed_share: 0.5          # the market crew and the helper are scheduled to the orders
      roles:
        - {role: "Owner, manager", hours: 8, owner: true, note: "sells the office and fundraiser accounts, runs pre-orders and works the market stall"}
        - {role: Production lead, hours: 7.6, wage: 25.00, note: "30 hours a week: mixes, shapes and bakes in the commissary before dawn on market days"}
        - {role: Baker's helper, hours: 4.5, wage: 18.00, note: "18 hours a week: panning, glazing, boxing, take-and-bake packs"}
        - {role: Market crew, hours: 3.6, wage: 16.50, note: "one person beside the owner at each market; plus tips"}
        - {role: Packing and delivery, hours: 2.0, wage: 17.00, note: "8 hours a week: boxes the pre-orders, runs the office drops"}
      prices:
        cinnamon_roll: 5.25
        guava_cheese_roll: 5.75
        cinnamon_roll_grande: 8.50
        roll_of_the_week_grande: 9.50
        cinnamon_roll_4pack: 19.00
        cinnamon_roll_6box: 27.00
        cinnamon_roll_12box: 50.00
        mini_roll_tray_24: 38.00
        roll_cake_9in: 45.00
        twist_loaf_cinnamon: 19.00
        twist_loaf_dulce: 21.00
        take_and_bake_6: 24.00
        cookie_chocolate_chip: 4.75
        brownie: 4.75
        cookie_brownie_box: 52.00
        iced_coffee: 4.75
        iced_latte: 5.75
        latte: 5.25
        drip_coffee: 3.75
        espresso: 3.25
        colada: 4.25
        matcha_latte: 5.75
        lemonade_kids: 3.75
        coffee_traveler: 42.00
      channels:
        - id: markets
          name: "Farmers markets and pop-ups"
          days_per_year: 80     # stall-days: two markets a week in season, one in summer, a few festivals
          scales_with_site: false
          fee_per_day: 110      # stall fees run from about $65 to $150
          note: "About 235 rolls a stall-day. Roll & Dough, a Miami pop-up, has sold about 300 in a Saturday for about $3,100."
          menu:
            cinnamon_roll: 60
            guava_cheese_roll: 35
            cinnamon_roll_grande: 12
            roll_of_the_week_grande: 35
            cinnamon_roll_4pack: 14
            cinnamon_roll_6box: 6
            twist_loaf_cinnamon: 7
            twist_loaf_dulce: 5
            cookie_chocolate_chip: 16
            brownie: 6
            iced_coffee: 34
            lemonade_kids: 14
        - id: drops
          name: "Saturday pre-order pickup"
          days_per_year: 46
          scales_with_site: false
          items_per_order: 1.2
          note: "Boxes ordered online by Thursday, picked up at the kitchen door or a partner's shop"
          menu:
            cinnamon_roll_4pack: 14
            cinnamon_roll_6box: 10
            cinnamon_roll_12box: 2
            mini_roll_tray_24: 2
            twist_loaf_cinnamon: 4
            twist_loaf_dulce: 3
            take_and_bake_6: 4
            roll_cake_9in: 1
        - id: orders
          name: "Office, gift and party orders"
          days_per_year: 150
          scales_with_site: false
          items_per_order: 3
          cost_pct_of_sales: 4  # courier drops beyond the delivery fee charged, and catering-platform commission on part
          note: "About two orders a working day at first: trays of mini rolls, dozens, loaves"
          menu:
            mini_roll_tray_24: 2
            cinnamon_roll_12box: 1
            twist_loaf_cinnamon: 1
            twist_loaf_dulce: 1
            cookie_brownie_box: 0.3
            roll_cake_9in: 0.3
        - id: fundraisers
          name: "School, league and church fundraisers"
          days_per_year: 8      # events a year
          scales_with_site: false
          items_per_order: 1
          cost_pct_of_sales: 30 # the group's share of each pack sold
          note: "Frozen take-and-bake packs and loaves sold by the group's families and delivered in one drop"
          menu:
            take_and_bake_6: 130
            twist_loaf_cinnamon: 25
      variable_costs_pct_of_sales: {marketing: 3.0, delivery_net: 0, repairs_maintenance: 0.5}
      fixed_costs_per_year: {insurance: 3500, software_pos: 3000, accounting_payroll_legal: 4500, licenses_music: 1500, waste_pest: 0, linens_uniforms: 600, internet_phone: 1200, vehicle: 7000}
      startup: {signage: 1500, opening_inventory: 5000, launch_marketing: 6000, furniture_base: 0}
      startup_fees: {"Brand, packaging design, website and ordering system": 10000, "Company set-up, permits and trademark": 5000}
    # Stage 2, the roll kitchen: the pop-up's channels move into the business's own
