# Pro forma inputs, read by tools/proforma.py (report: db/proforma.md; viewer: Pro forma tab).
#
# Sales, food cost and prep hours come from the menu database itself. Each format
# (under labor.formats) has a design day: the bakery-café uses every product's
# par_daily; the roll bakery lists its own short menu and volumes. Each site's
# sales_index scales its format's design day to the site. Everything else is set here.
#
# Dollar figures are 2026 estimates unless a source is given. Sites, sizes and rents
# come from the reports in reports/ (site scan, 2026-11-07; shortlist, 2026-11-08);
# none has been confirmed with a broker.

as_of: 2026-11-10

operating:
  days_per_year: 360            # default: open daily, closed five holidays; a format can set its own
  hours: "6:30 am to 3:00 pm, seven days"
  # Year-1 sales as % of the site's steady state, month by month.
  ramp_year1_pct: [55, 60, 65, 70, 75, 80, 85, 88, 91, 94, 97, 100]
  price_growth_pct: 3           # Year 3 sales over Year 2, from menu price increases
  cost_inflation_pct: 3         # yearly rise in wages, rent and fixed costs
  # Points added to the menu's food-and-packaging cost for comps, staff meals,
  # spoilage beyond the waste allowances and price drift before real invoices.
  # Raised from 3 on 2026-11-10: it brings the café to 25% of sales, the low end of
  # the research's 25–35% benchmark. The recipes allow only 0–5% for waste and every
  # ingredient price is still an estimate.
  cogs_buffer_pts: 5.5

variable_costs_pct_of_sales:
  card_processing: 2.6          # about 90% of sales on cards at about 2.9%
  repairs_maintenance: 1.5
  supplies_cleaning: 1.5        # cleaning, smallwares replacement, non-food supplies
  marketing: 2.0
  delivery_net: 0.5             # app commissions after the 20% app price markup
  miscellaneous: 1.0

fixed_costs_per_year:           # Year-1 dollars
  insurance: 8500               # general liability, property, umbrella; workers' comp is in the payroll burden
  software_pos: 5000            # point of sale, online ordering, scheduling
  accounting_payroll_legal: 9000
  licenses_music: 2500          # Common Victualler and health permit renewals, music licensing
  waste_pest: 7200
  linens_uniforms: 2400
  internet_phone: 2400

# Gas, electric and water for ovens, refrigeration and the bar. Raised from $10 on
# 2026-11-10: $10 came to 1.5–2% of sales, and restaurants commonly run 3% or more
# (a rule of thumb, not from the market research).
utilities_per_sqft_year: 20

labor:
  burden_pct: 12                # FICA, FUTA, MA UI, training fund, workers' comp (research: statutory 8.5–9% plus workers' comp 1–3%)
  fixed_share: 0.6              # share of scheduled hours that doesn't flex with sales
  manager:
    title: General manager
    salary: 60000               # if the owner runs the shop instead, add this back: see owner's earnings
  # Scheduled hourly crew per day at each format's design volume. Wages from the
  # research's Boston medians: bakers $18.54, food prep $19.07, counter $17.45,
  # MA minimum $15.00; counter and bar staff also share tips.
  formats:
    cafe:
      label: "Bakery-café: full menu with lunch, about 24 seats"
      design_index: 1.0         # staffed for the menu's full par day
      items_per_order: 2.0      # assumption, used only to turn sales into an order count
      hero: cinnamon_roll
      manager: true             # a hired general manager runs it
      roles:
        - {role: Lead baker, hours: 8.5, wage: 25.00, note: "4:30 am start: mixes, shapes and bakes"}
        - {role: Baker and prep, hours: 8, wage: 20.00, note: "pastry, glazes, cookie and brownie batches, salad prep"}
        - {role: Line cook, hours: 8, wage: 19.50, note: "breakfast and lunch sandwiches, soup, catering boxes"}
        - {role: Baristas, hours: 14, wage: 16.50, note: "two at the morning peak, one after; plus tips"}
        - {role: Counter, hours: 10, wage: 15.50, note: "register, pastry case, grab-and-go; plus tips"}
        - {role: Dish and porter, hours: 5, wage: 15.50, note: "late morning to close"}
    # The smaller first shop: one hero pastry, a short case and coffee, run by the owner.
    # The research's independent winners start this way and add lunch at a second, bigger shop.
    roll_bakery:
      label: "Roll bakery: the cinnamon roll, six other pastries and coffee; about 8 seats"
      hours: "7:00 am to 2:00 pm, Tuesday to Sunday"
      days_per_year: 307        # six days a week, closed five holidays
      design_index: 1.0         # staffed for this format's design day
      items_per_order: 1.8      # assumption, used only to turn sales into an order count
      hero: cinnamon_roll
      manager: false            # the owner runs it; the P&L pays the owner nothing
      owner_pay_target: 65000   # what the owner could earn as a hired lead baker: $25 an hour, 50 hours a week
      roles:
        - {role: "Owner, lead baker", hours: 10, owner: true, note: "4:30 am start: mixes, rolls, bakes and glazes; runs the shop"}
        - {role: Baker and prep, hours: 6, wage: 20.00, note: "shaping at the morning peak, then scones, muffins, cookies and tomorrow's dough"}
        - {role: Barista, hours: 8.5, wage: 16.50, note: "opens the bar; plus tips"}
        - {role: Counter, hours: 8, wage: 15.50, note: "register, pastry case and boxes; plus tips"}
        - {role: Peak help, hours: 3, wage: 15.50, note: "an average: none on quiet weekdays, more on weekends"}
        - {role: Dish and close, hours: 2, wage: 15.50, note: ""}
      # This format's design day: units sold a day. Products left out aren't sold.
      # No griddle, soup or salads, so no grease hood and no line cook.
      menu:
        cinnamon_roll: 110
        blueberry_scone: 15
        mini_vanilla_scone: 20
        blueberry_muffin: 18
        coffee_cake_slice: 10
        cookie_chocolate_chip: 20
        brownie: 12
        drip_coffee: 55
        latte: 30
        iced_coffee: 15
        iced_latte: 12
        matcha_latte: 6
        chai_latte: 6
        espresso: 6
        lemonade_kids: 7
        oat_milk_swap: 15
        almond_milk_swap: 4
        cinnamon_roll_4pack: 6
        pastry_box_dozen: 1.5
        cookie_brownie_box: 0.5
        coffee_cake_whole: 0.3
        coffee_traveler: 0.5
      # A smaller shop with fewer staff: these replace the same lines below and in startup.
      fixed_costs_per_year: {insurance: 6000, software_pos: 3600, accounting_payroll_legal: 7000, licenses_music: 2000, waste_pest: 4800, linens_uniforms: 1500}
      startup: {signage: 8000, opening_inventory: 5000, launch_marketing: 8000, furniture_base: 4000}

# What each format needs, zone by zone. Seats at about 15 sq ft each.
space_program:
  cafe:
    - {zone: "Bakery production: mixers, bench, double-stack oven, proofer, speed racks", sqft: 650}
    - {zone: "Hot line under a Type 1 hood: griddle, range for soup and glaze", sqft: 120}
    - {zone: "Cold and dry storage: walk-in, freezer, shelving", sqft: 220}
    - {zone: "Dish and sanitation: 3-bay sink, dishwasher, mop sink", sqft: 120}
    - {zone: "Coffee bar, pastry and grab-and-go cases, register, pickup shelf", sqft: 300}
    - {zone: "Seating, 24 seats", sqft: 360}
    - {zone: "Restroom, office, staff lockers", sqft: 160}
    - {zone: "Entry, queue and circulation", sqft: 300}
  roll_bakery:
    - {zone: "Bakery production: 40-qt mixer, bench, sheeter, double-stack oven, proofer, speed racks", sqft: 360}
    - {zone: "Cold and dry storage: reach-ins, freezer, shelving", sqft: 110}
    - {zone: "Dish and sanitation: 3-bay sink, dishwasher, mop sink", sqft: 70}
    - {zone: "Coffee bar, pastry case, register", sqft: 150}
    - {zone: "Seating, 8 seats", sqft: 110}
    - {zone: "Restroom and office nook", sqft: 70}
    - {zone: "Entry and queue", sqft: 60}

# Equipment by format: estimates at new dealer prices before delivery and install.
# Research anchors: double rack oven $55.6–57.0K, mixer $3–15K, proofing $5–10K,
# hood $6–25K (gapfill_model_economics.md). A double-stack convection oven replaces
# the rack oven at this volume. The roll bakery's ovens are electric and it has no
# griddle or fryer, so it should not need a grease hood: confirm with the local
# building and health departments.
equipment:
  cafe:
    - {item: "Double-stack convection oven, gas", cost: 22000}
    - {item: "40-qt planetary mixer (production.md's biggest labor saver)", cost: 16000}
    - {item: "20-qt planetary mixer for glazes, fillings and small batches", cost: 6000}
    - {item: "Proofer-retarder cabinet", cost: 9000}
    - {item: "Griddle and two-burner range", cost: 6500}
    - {item: "Walk-in cooler, about 8 × 10 ft", cost: 16000}
    - {item: "Reach-in freezer and two undercounter refrigerators", cost: 14000}
    - {item: "Two-group espresso machine and two grinders", cost: 23000}
    - {item: "Batch brewer, hot water, cold brew system, water filtration", cost: 7000}
    - {item: "Refrigerated and dry pastry cases", cost: 14000}
    - {item: "Open grab-and-go cold case", cost: 9000}
    - {item: "Sinks, stainless tables, shelving", cost: 14000}
    - {item: "Undercounter dishwasher", cost: 7000}
    - {item: "Speed racks, sheet pans, smallwares", cost: 9000}
    - {item: "Food processor, blenders, scales, juicer", cost: 4500}
    - {item: "Point-of-sale hardware and kitchen screen", cost: 4000}
  roll_bakery:
    - {item: "Double-stack convection oven, electric", cost: 20000}
    - {item: "40-qt planetary mixer", cost: 16000}
    - {item: "Reversible dough sheeter", cost: 7000}
    - {item: "Proofer-retarder cabinet", cost: 9000}
    - {item: "Two reach-in refrigerators and a reach-in freezer", cost: 12000}
    - {item: "Compact two-group espresso machine and grinder", cost: 15000}
    - {item: "Batch brewer, hot water, cold brew system, water filtration", cost: 6000}
    - {item: "Pastry case", cost: 9000}
    - {item: "Sinks, stainless tables, shelving", cost: 9000}
    - {item: "Undercounter dishwasher", cost: 6500}
    - {item: "Speed racks, sheet pans, roll pans, smallwares", cost: 7000}
    - {item: "Induction burners for glaze, scales, food processor", cost: 2500}
    - {item: "Point-of-sale hardware", cost: 2500}

startup:
  soft_costs_pct_of_buildout: 15   # design, engineering, permits, legal (research: soft costs run 30–40% of a full restaurant build; less on a second-generation space). A site can override it with soft_costs_pct.
  # Rent and NNN are paid from lease signing to opening (each site's months_to_open).
  # No free rent is assumed: none of the listings mentions free rent or a build-out allowance.
  furniture_per_seat: 450
  furniture_base: 6000
  signage: 12000
  preopening_payroll_weeks: 3      # training and test bakes, at 60% of the scheduled crew
  manager_preopening_weeks: 6      # the general manager starts early to hire, train and set up
  opening_inventory: 10000
  launch_marketing: 12000
  deposit_months: 3                # research: landlords often want 2–3 months' rent up front
  working_capital_months: 2        # of rent, payroll and fixed costs
  contingency_pct: 10              # of build-out and equipment

financing:
  loan_share_pct: 70               # SBA 7(a)-style loan; the rest is owner equity
  rate_pct: 10.5                   # estimate: prime plus about 2.75 points
  term_years: 10

scenarios:
  - {id: conservative, name: Conservative, sales_factor: 0.8}
  - {id: base, name: Base, sales_factor: 1.0}
  - {id: upside, name: Upside, sales_factor: 1.2}

# sales_index scales the format's design day (about $3,630 for the bakery-café,
# about $1,730 for the roll bakery) to the site's steady state. These are judgment
# calls from the site research's traffic notes, not measured sales.
sites:
  - id: cambridge
    name: "1105 Massachusetts Ave, Cambridge"
    short: Cambridge
    area: "East edge of Harvard Square"
    format: cafe
    sqft: 2500
    seats: 24
    rent_psf: 37.00
    nnn_psf: 12.00
    escalation_pct: 3
    buildout_psf: 100
    equipment_credit: 16000
    equipment_credit_note: "the diner's walk-in coolers stay, so no new walk-in"
    months_to_open: 5             # working hood and walk-ins; licensing and refit
    sales_index: 0.9
    kitchen: "Former diner with a very large hood, two walk-in coolers, storage room and counter (2024 listing)"
    rent_basis: "$35 a sq ft in the 2024 listing, raised 3% a year to $37; NNN charges not stated, $12 assumed"
    risks: "Rent is two years old; two operators closed here in two years; needs bakery-café sales"
    source: "Site scan lease #3; LoopNet 33223782 (2024, snippet); for-lease sign reported July 2026"
  - id: charles_street
    name: "145 Charles St, Boston"
    short: Beacon Hill
    area: "Charles St on Beacon Hill, near the Charles/MGH Red Line stop and Mass General"
    format: cafe
    sqft: 1838                    # street level; the basement isn't counted
    seats: 20
    rent_psf: 65.00
    rent_assumed: true
    nnn_psf: 12.00
    escalation_pct: 3
    buildout_psf: 110             # restaurant dark since Aug 2024; hood tag expired May 2024
    equipment_credit: 0
    months_to_open: 7             # take-out may need a Boston zoning appeal; historic-district review of signs
    sales_index: 0.95
    space_note: "Short on the street floor; the basement (size not published) may take storage and some prep"
    kitchen: "King & I Thai, 1983 to Aug 2024; city inspections cite a cooking-line vent hood (2021–22), a walk-in (2018) and an expired hood tag (May 2024)"
    rent_basis: "Not published (NNN, 1–5-year term offered, snippet). $65 assumed: Charles St is a premium street and an undated broker source puts Boston's median quoted rent near $56; $12 NNN assumed"
    risks: "Rent unknown; empty since Aug 2024; short term offered; take-out may need a zoning appeal; Beacon Hill's historic commission reviews signs and storefronts; Tatte (70 Charles) and Flour (Cambridge St) nearby"
    source: "Site shortlist #1; CommercialSearch and TenantBase listings (snippets, seen 2026-11-08); Boston food inspection records"
