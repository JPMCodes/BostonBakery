        - {role: Market crew, hours: 2.7, wage: 16.50, note: "one or two at a stall, about 62 stall-days a year; plus tips"}
        - {role: Dish and clean, hours: 2.0, wage: 15.00, note: "12 hours a week"}
      prices:
