startup:
  soft_costs_pct_of_buildout: 15   # design, engineering, permits, legal (research: soft costs run 30–40% of a full restaurant build; less on a second-generation space). A site can override it with soft_costs_pct.
  # Rent and NNN are paid from lease signing to opening (each site's months_to_open).
  # No free rent is assumed: none of the listings mentions free rent or a build-out allowance.
  furniture_per_seat: 450
  furniture_base: 6000
  signage: 12000
  preopening_payroll_weeks: 3      # training and test bakes, at 60% of the scheduled crew
  manager_preopening_weeks: 6      # the general manager starts early to hire, train and set up
  opening_inventory: 10000
  launch_marketing: 12000
  deposit_months: 3                # research: landlords often want 2–3 months' rent up front
  working_capital_months: 2        # of rent, payroll and fixed costs
  contingency_pct: 10              # of build-out and equipment

# Local costs. The inputs above are Boston's; a site with `market: miami` uses these
# instead. Lines not named here (food cost, prices, insurance, other fixed costs,
# startup lines) stay as above. Research: reports/Miami roll bakery feasibility.md.
markets:
  miami:
    label: "Miami-Dade"
    note: "Florida's minimum wage reached $15.00 on September 30, 2026, the same as Massachusetts', so counter pay converges with Boston's; skilled baking pay runs about 5–10% lower. Florida has no paid-leave or sick-leave mandate and a lighter unemployment tax. Power costs about half Boston's per kWh, but the air conditioning runs all year. Menu prices are left at the database's, which sit at or below Coral Gables specialty bakeries (croissants $5.50–5.95) and two to five times Cuban-bakery prices."
    wages: {Lead baker: 23.00, Baker and prep: 19.00, Barista: 16.00, Counter: 15.25, Peak help: 15.00, Dish and close: 15.00, Line cook: 18.00, Baristas: 16.00, Dish and porter: 15.00}
    burden_pct: 11                 # FICA and FUTA, Florida reemployment tax (2.7% on $7,000), workers' comp; no state paid leave
    utilities_per_sqft_year: 15    # all-electric bakery with year-round air conditioning; estimate, no Miami benchmark found
    closed_days_per_year: 2        # tropical storms: about 0.3 events a year, a few days each; real years are lumpy
    sources: "Wages: Coral Gables bakery job ads 2026 ($18–24, assistant pastry chef $25–28), Florida minimum wage schedule, BLS OEWS May 2025 (Miami bakers' median $17.73). Payroll burden: Florida reemployment tax and NCCI bakery class rate ($2.778 per $100 from 2026-01-01). Utilities: FPL GSD-1 tariff ($12.70 per kW plus about 6.3¢ a kWh), EIA Florida commercial average 12.84¢ a kWh (Feb 2026), Miami-Dade water and sewer rates. Storms: DisasterAWARE (0.3 events a year near Miami). All in research_notes/Miami roll bakery feasibility/costs_rules.md."

financing:
  owner_cash_limit: 500000         # the most the owner would put in; a startup at or under it takes no loan
  loan_share_pct: 70               # SBA 7(a)-style loan; the rest is owner equity. A format can set its own share
  rate_pct: 10.5                   # estimate: prime plus about 2.75 points
  term_years: 10

scenarios:
  - {id: conservative, name: Conservative, sales_factor: 0.8}
  - {id: base, name: Base, sales_factor: 1.0}
  - {id: upside, name: Upside, sales_factor: 1.2}

