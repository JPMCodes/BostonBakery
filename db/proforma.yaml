    - {item: "Market kit: two tents, tables, display cases, coolers, banners", cost: 8000}
    - {item: "Speed racks, sheet pans, roll pans, loaf moulds, smallwares", cost: 6000}
    - {item: "Insulated carriers and two chest freezers for take-and-bake packs", cost: 3000}
