id: sandwich_roll_lunch
name: Lunch Sandwich Roll
kind: roll
status: draft
version: "1.0"
approved_on: null
used_by: [blt_sandwich, harissa_chicken_sandwich]
yield:
  units: 1
  grams: 108
  description: "1 roll: 120 g dough bakes to about 108 g"

ingredients:
  - {item: dough_signature, qty: 120, unit: g}

method:
  - "Shape tight balls from 120 g pieces of chilled dough. Set them seam side down, 6 per parchment-lined half-sheet, and flatten slightly so the roll bakes wide rather than tall."
  - "Proof until about doubled and a gentle poke springs back slowly."
  - "Brush with egg wash: the white saved from the dough's yolk plus 1 tablespoon water."
  - "Default bake until confirmed: 350°F for 20–24 minutes, to 190°F inside."

notes:
  - "The breakfast roll in a bigger size, so every sandwich runs on one dough. One dough batch makes 9 lunch rolls."
  - "Egg wash uses a by-product white, so it is not costed."

history:
  - date: 2026-11-08
    version: "1.0"
    change: "Drafted for the lunch sandwiches."
