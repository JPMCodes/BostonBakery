used_by: [mini_vanilla_scone]
yield:
  grams: 744
  description: "24 mini scones at 31 g"

ingredients:
  - {item: flour_ap, qty: 300, unit: g, note: "unbleached"}
  - {item: flour_pastry, qty: 37.0, unit: g, note: "unbleached"}
  - {item: butter_unsalted, qty: 94.3, unit: g, note: "cold"}
  - {item: sugar_granulated, qty: 84.2, unit: g}
  - {item: egg_large, qty: 21.6, unit: g, note: "about 0.4 large egg"}
  - {item: egg_yolk, qty: 16.8, unit: g, note: "about 0.9 large yolk"}
  - {item: cream_heavy, qty: 111, unit: g, note: "cold"}
  - {item: milk_whole, qty: 53.2, unit: g, note: "3 tbsp + 2 tsp"}
  - {item: baking_powder, qty: 11.8, unit: g, note: "1 tbsp"}
  - {item: salt_fine, qty: 4.69, unit: g, note: "fine sea salt, 3/4 tsp"}
  - {item: vanilla_bean_paste, qty: 5.05, unit: g, note: "3/4 + 1/8 tsp"}
