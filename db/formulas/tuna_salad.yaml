id: tuna_salad
name: Tuna Salad
kind: protein salad
status: draft
version: "1.0"
approved_on: null
used_by: [add_tuna_salad]
yield:
  grams: 1000
  description: "10 scoops at 100 g"

ingredients:
  - {item: tuna_albacore, qty: 660, unit: g, note: "drained well and flaked"}
  - {item: mayonnaise, qty: 170, unit: g}
  - {item: celery, qty: 90, unit: g, note: "small dice"}
  - {item: onion_red, qty: 40, unit: g, note: "finely diced"}
  - {item: lemon_juice, qty: 20, unit: g}
  - {item: dijon, qty: 10, unit: g}
  - {item: parsley_flat, qty: 10, unit: g, note: "chopped"}
  - {item: black_pepper, qty: 1.5, unit: g}

method:
  - "Drain the tuna well and flake it."
  - "Whisk the mayonnaise, lemon juice, Dijon and pepper. Fold in the tuna, celery, red onion and parsley."
  - "Taste before adding salt; the tuna is already salted."
  - "Refrigerate covered and dated at 41°F or below; use within 3 days."

history:
  - date: 2026-11-07
    version: "1.0"
    change: "Drafted as a salad add-on. Tuna, fennel, orange and lemon is a classic Sicilian pairing, so it suits the fennel bowl."
