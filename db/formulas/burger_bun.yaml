  production_batches: 1
  at_scale: {batch_min: 0.3, production_batches: 1, note: "Per bun, from a 40-qt batch: divide, round, press, pan 15 to a full sheet, egg wash, bake handling. To confirm on the first production runs."}
  note: "Per bun: shape, press, pan, egg wash, bake handling."
