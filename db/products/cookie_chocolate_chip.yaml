id: cookie_chocolate_chip
name: Chocolate Chip Walnut Cookie
category: pastry
status: draft
version: "1.0"
approved_on: null
description: "A 6 oz Levain-style cookie: crisp and golden outside, thick and gooey inside, loaded with semisweet chips and walnuts. Baked from frozen dough in rounds all day."
batch_units: 24
waste_pct: 5

build:
  - {item: dough_cookie_levain, qty: 170, unit: g}
  - {item: bag_glassine_1lb, qty: 1, unit: each, note: "to go; for here, plate it"}
  - {item: napkin_kraft, qty: 1, unit: each}

production:
  bake: "Default until confirmed: bake straight from the freezer at 410°F (375°F convection) for 13–16 minutes, 8 to a half-sheet, until golden outside and still soft in the center. Cool on the pan 15 minutes; they finish setting there."
  hold: "Best the day they're baked. Bake small rounds through the day instead of one big morning bake."
  packaging: "To go: a 1 lb glassine bag and a napkin. For here: a plate."

allergens_declared: [egg, milk, soy, tree nuts, wheat]

