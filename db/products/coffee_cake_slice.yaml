id: coffee_cake_slice
name: Sour Cream Coffee Cake Slice
category: pastry
status: draft
version: "1.0"
approved_on: null
description: "A 107 g slice of all-butter sour cream coffee cake with a ribbon of toasted walnuts, brown sugar and Saigon cinnamon and a brown-butter streusel top. Baked in a 12-cup bundt pan, 16 slices a cake."
batch_units: 16
waste_pct: 5

build:
  - {item: coffee_cake_bundt, qty: 1, unit: each, note: "one slice, 1/16 of a cake"}
  - {item: paper_wax_square, qty: 1, unit: each}
  - {item: bag_kraft_6lb, qty: 1, unit: each, note: "to go; for here, plate it"}
  - {item: napkin_kraft, qty: 1, unit: each}

production:
  cut: "Cut each cooled cake into 16 slices of about 107 g: halves, then quarters, eighths and sixteenths."
  hold: "Keep cakes whole under a cover at room temperature and cut to order, pressing plastic wrap against the cut faces, or wrap each cut slice. Best within 3 days of baking."
  packaging: "To go: the slice on a dry-wax square in a #6 kraft bag, with a napkin. For here: serve on a plate."

allergens_declared: [egg, milk, tree nuts, wheat]

pricing:
  suggested_retail_usd: 4.50
  rationale: "See db/pricing.md"

validation:
  tested: []
  pending:
    - "First test bake: confirm the bake time, that the ribbon neither sinks nor opens a gap, and that the topping releases from the pan."
    - "Side-by-side tasting against the Original Boston Cinnamon Walnut Coffee Cake."
    - "Shelf-life check on days 1–3, whole and cut."

history:
