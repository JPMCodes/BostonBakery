id: breakfast_sandwich_fennel_sausage
name: Fennel Sausage Breakfast Sandwich
status: approved
version: "1.1"
approved_on: 2026-11-07
description: "The breakfast sandwich plus a fennel pork sausage patty: sausage, fried egg, sliced cheddar and harissa sauce on the house sandwich roll."
batch_units: 12
waste_pct: 3

build:
  - {item: sandwich_roll, qty: 1, unit: each}
  - {item: sausage_fennel, qty: 57, unit: g, note: "2 oz raw patty, about 42 g cooked"}
  - {item: butter_unsalted, qty: 5, unit: g, note: "for toasting the roll and frying the egg"}
  - {item: egg_large, qty: 1, unit: each}
  - {item: cheese_cheddar_sliced, qty: 21, unit: g, note: "1 slice, 3/4 oz"}
  - {item: harissa_sauce, qty: 15, unit: g, note: "1 tablespoon"}

production:
  prep:
    - "Portion the sausage into 57 g balls and press each into a 4-inch patty about 1/4 inch thick. It shrinks to about the roll's width. Hold refrigerated."
  build:
    - "Cook the patty on a griddle or skillet over medium, 3–4 minutes a side, to 160°F inside."
    - "Split the roll and toast the cut sides in the butter."
    - "Fry the egg in the same pan. Lay the cheddar on the egg and cover for about 30 seconds to melt."
    - "Spread the harissa on the top half. Stack: bottom roll, sausage, egg and cheese, top roll."

qa:
  - "Sausage patty at 160°F inside before it goes on the sandwich."

allergens_declared: [egg, milk, wheat]

pricing:
  suggested_retail_usd: 10.25
  rationale: "See db/pricing.md"

validation:
  tested: []
  pending:
    - "Choose the sausage (a brand or a house recipe) and check its label; some contain milk or soy."
    - "Test-build it: patty size, how the fennel plays against the harissa, and the cook time to 160°F."
    - "Pick the harissa sauce brand, as for the base sandwich."

history:
  - date: 2026-11-07
    version: "1.0"
    change: "Added as the second sandwich SKU at $10.00, $1.50 above the base Breakfast Sandwich."
  - date: 2026-11-07
    version: "1.1"
    change: "Suggested retail raised to $10.25 for margin; still mid-band for Boston breakfast sandwiches."
