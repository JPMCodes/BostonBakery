id: roll_cake_9in
name: Celebration Roll Cake (9-inch)
category: catering
status: draft
version: "1.0"
approved_on: null
description: "One giant cinnamon roll coiled in a 9-inch round, glazed, boxed on a cake board and ready for candles. Serves 8–10. Pre-order 48 hours ahead."
waste_pct: 2

build:
  - {item: dough_signature, qty: 800, unit: g}
  - {item: filling_cinnamon, qty: 195, unit: g}
  - {item: glaze_buttermilk, qty: 150, unit: g}
  - {item: cake_board_10in, qty: 1, unit: each}
  - {item: box_cake_10in, qty: 1, unit: each}
  - {item: label_grab_and_go, qty: 1, unit: each}

production:
  shape: "Roll the dough to 20×12 inches, fill, and cut six strips of 2 inches along the long side. Coil the first strip in the center of a lined 9-inch round and wrap the rest around it, filling side in."
  bake: "325°F for 40–50 minutes, to 190°F in the center; tent with foil after 25 minutes."
  glaze: "Glaze at 95–100°F; set 30 minutes before boxing."

allergens_declared: [egg, milk, wheat]

