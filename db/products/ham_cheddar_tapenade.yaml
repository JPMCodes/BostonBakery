id: ham_cheddar_tapenade
name: Ham, Cheddar & Olive Tapenade
category: sandwich
status: draft
version: "1.1"
approved_on: null
description: "Hardwood-smoked ham and melted cheddar with house olive tapenade and arugula on a toasted, cheddar-crusted oval house roll."
batch_units: 6
waste_pct: 3

build:
  - {item: roll_lunch_cheddar, qty: 1, unit: each}
  - {item: butter_unsalted, qty: 4, unit: g, note: "for toasting the roll"}
  - {item: ham_smoked, qty: 85, unit: g, note: "3 oz, thin-sliced"}
  - {item: cheese_cheddar_sliced, qty: 2, unit: each, note: "2 slices, 42 g"}
  - {item: tapenade_olive, qty: 20, unit: g, note: "on the top half"}
  - {item: arugula, qty: 10, unit: g, note: "fresh, peppery contrast to the salt and brine"}
  - {item: wrap_foil_insulated, qty: 1, unit: each, note: "to go; for here, plate it"}
  - {item: label_sandwich, qty: 1, unit: each}
  - {item: bag_kraft_6lb, qty: 1, unit: each}
  - {item: napkin_kraft, qty: 1, unit: each}

production:
  build:
    - "Split the roll and toast the cut sides in the butter."
    - "Layer the ham and cheddar on the bottom half and melt on the flat-top or in the press, 3–4 minutes."
    - "Spread the tapenade on the top half, add the arugula, and close."
  packaging: "To go: wrap in insulated foil, seal with the sandwich label, and bag with a napkin. For here: serve it on a plate."

allergens_declared: [egg, milk, wheat]

pricing:
  suggested_retail_usd: 12.50
  rationale: "See db/pricing.md"

validation:
  tested: []
  pending:
    - "Pick the ham and check its label for allergens."
    - "Test build: check the salt level with ham, cheddar and tapenade together, and the melt time."

history:
  - date: 2026-11-08
    version: "1.0"
    change: "Drafted at a suggested $11.50, replacing the ham, cheddar and apple version."
  - date: 2026-11-08
    version: "1.1"
    change: "Price raised to $12.50 for margin, level with the harissa chicken sandwich."

par_daily: 12
labor:
  unit_min: 1.9
  note: "Toast, melt, build and wrap."
